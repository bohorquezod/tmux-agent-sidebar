name: shfmt

on:
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/shfmt.yml"
  pull_request:
    paths:
      - "scripts/**"
      - ".github/workflows/shfmt.yml"

jobs:
  shfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup shfmt
        uses: mfinelli/setup-shfmt@v3
        with:
          shfmt-version: "3.10.0"

      - name: Check formatting
        run: shfmt -i 2 -ci -bn -d scripts/
