name: Bug report
description: Something is not working as expected
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening a bug report, press `prefix+M` to reload the plugin and check if the issue persists.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: The sidebar does not open when I press prefix+m...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the bug consistently.
      placeholder: |
        1. Open tmux with two sessions
        2. Press prefix+m
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: The sidebar should open on the left side...
    validations:
      required: true

  - type: input
    id: tmux_version
    attributes:
      label: tmux version
      placeholder: "tmux -V  →  tmux 3.4"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS and shell
      placeholder: "macOS 14.5 / bash 3.2"
    validations:
      required: true

  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - TPM (Tmux Plugin Manager)
        - run-shell in .tmux.conf
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: Content from `/tmp/sidebar_debug.log` or any error output.
      render: shell
